name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: SAM build
        run: sam build
        env:
          NODE_ENV: development

      - name: Remove failed stack if needed
        run: |
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name mobile-wedding-invitation \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null || echo "NOT_FOUND")
          if [ "$STATUS" = "ROLLBACK_COMPLETE" ]; then
            echo "Deleting stack in ROLLBACK_COMPLETE state..."
            aws cloudformation delete-stack --stack-name mobile-wedding-invitation
            aws cloudformation wait stack-delete-complete --stack-name mobile-wedding-invitation
          fi

      - name: SAM deploy
        env:
          FRONTEND_ORIGIN: ${{ secrets.FRONTEND_ORIGIN }}
        run: |
          if [ -z "$FRONTEND_ORIGIN" ]; then
            echo "::warning::FRONTEND_ORIGIN secret is not set. API CORS will allow http://localhost:5173 only."
            echo "::warning::Add GitHub Secret FRONTEND_ORIGIN=https://your-app.vercel.app for Vercel (exact URL, no wildcards)."
            FRONTEND_ORIGIN="http://localhost:5173"
          fi
          sam deploy \
            --stack-name mobile-wedding-invitation \
            --resolve-s3 \
            --region ${{ secrets.AWS_REGION }} \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides "AdminPassword=${{ secrets.ADMIN_PASSWORD }} DeletePassword=${{ secrets.DELETE_PASSWORD }} FrontendOrigin=${FRONTEND_ORIGIN}"
