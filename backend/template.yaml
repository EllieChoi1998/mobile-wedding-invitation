AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Mobile wedding invitation API - S3 presigned uploads and DynamoDB metadata

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 10
    MemorySize: 256
    Architectures:
      - x86_64
    Environment:
      Variables:
        TABLE_NAME: !Ref PhotosTable
        BUCKET_NAME: !Ref PhotosBucket

Parameters:
  FrontendOrigin:
    Type: String
    Default: http://localhost:5173
    Description: Frontend origin for CORS (set to your Vercel URL after deploy)

Resources:
  PhotosTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-photos'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  PhotosBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - GET
              - PUT
              - HEAD
            AllowedOrigins:
              - 'http://localhost:5173'
              - 'https://*.vercel.app'
            MaxAge: 3600

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      CorsConfiguration:
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
        AllowOrigins:
          - !Ref FrontendOrigin
          - http://localhost:5173

  PresignFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - src/handlers/presignUpload.js
    Properties:
      CodeUri: .
      Handler: presignUpload.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PhotosTable
        - S3CrudPolicy:
            BucketName: !Ref PhotosBucket
      Events:
        PresignApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /photos/presign
            Method: POST

  ListPhotosFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - src/handlers/listPhotos.js
    Properties:
      CodeUri: .
      Handler: listPhotos.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PhotosTable
        - S3ReadPolicy:
            BucketName: !Ref PhotosBucket
      Events:
        ListPhotosApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /photos
            Method: GET

  SubmitRsvpFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - src/handlers/submitRsvp.js
    Properties:
      CodeUri: .
      Handler: submitRsvp.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PhotosTable
      Events:
        SubmitRsvpApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /rsvp
            Method: POST

  SubmitGuestbookFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - src/handlers/submitGuestbook.js
    Properties:
      CodeUri: .
      Handler: submitGuestbook.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PhotosTable
      Events:
        SubmitGuestbookApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /guestbook
            Method: POST

  ListGuestbookFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - src/handlers/listGuestbook.js
    Properties:
      CodeUri: .
      Handler: listGuestbook.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PhotosTable
      Events:
        ListGuestbookApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /guestbook
            Method: GET

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/prod'
  PhotosBucketName:
    Description: S3 bucket for guest photos
    Value: !Ref PhotosBucket
  PhotosTableName:
    Description: DynamoDB table for photo metadata
    Value: !Ref PhotosTable
